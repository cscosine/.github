name: ecosystem

# The "What lives here" section of the organisation page (profile/README.md), regenerated from GitHub: releases,
# release candidates, CI status, what each project is built on. Nightly, and on demand after a release.
on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Regenerate the section
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/ecosystem.py
      - name: Commit when it changed
        run: |
          if git diff --quiet profile/README.md; then
            echo "up to date"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -am "Organisation page: projects, releases and CI regenerated"
            git push
          fi
