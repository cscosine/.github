name: ecosystem

# Regenerated from GitHub, daily at 07:00 CET, 08:00 in summer (on Monday, after the weekly build train), when the
# generator changes, and on demand after a release: the projects section of the organisation page (profile/README.md)
# and ECOSYSTEM.md (every repository, versions, dependencies, what needs attention).
on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
  # the generator or its inputs changed (its own commit touches neither, so no loop)
  push:
    branches: [main]
    paths: [scripts/ecosystem.py, scripts/ecosystem_report.py, scripts/ecosystem.json, scripts/github-settings.json]

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Regenerate the organisation page and ECOSYSTEM.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 scripts/ecosystem_report.py
          python3 scripts/ecosystem.py
      - name: Commit when it changed
        run: |
          if git diff --quiet profile/README.md ECOSYSTEM.md; then
            echo "up to date"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -am "Organisation page and ECOSYSTEM.md regenerated"
            git push
          fi
